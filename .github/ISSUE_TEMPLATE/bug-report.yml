name: Bug report
description: 报告可复现的功能、安全或文档问题
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        请先阅读 README、SECURITY.md 和 CONTRIBUTING.md。
        请勿粘贴 Token、Cookie、Keychain 内容、真实邮箱、账号 ID、额度或未脱敏日志。
  - type: input
    id: version
    attributes:
      label: 智额版本与构建号
      description: 例如 0.3.28 (31)
      placeholder: 0.3.28 (31)
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: macOS 与硬件
      description: 请写 macOS 版本和 Apple Silicon/Intel
      placeholder: macOS 15.x, Apple Silicon
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 复现步骤
      description: 请按顺序写出最小、可重复的操作
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
      description: 日志只提供脱敏后的必要片段
    validations:
      required: true
  - type: dropdown
    id: scope
    attributes:
      label: 影响范围
      options:
        - Mac 应用
        - Windows 应用
        - 文档/链接
        - 构建/CI/发布
        - 安全/隐私（请不要公开敏感细节）
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 我确认没有提交密钥、Token、Cookie、Keychain 内容、真实账号信息或未脱敏日志。
          required: true
