name: Feature request
description: 提议新功能或文档改进
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        请说明用户问题和验收结果，不要提交真实账号、额度、凭证或第三方服务私密信息。
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 谁遇到什么问题，当前如何绕过
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 描述用户操作、可见结果和失败处理
    validations:
      required: true
  - type: textarea
    id: privacy
    attributes:
      label: 隐私、权限和网络影响
      description: 是否新增本地读取、Keychain、网络出口、遥测或第三方依赖
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
  - type: checkboxes
    id: scope
    attributes:
      label: 范围确认
      options:
        - label: 我理解第三方服务、商标和依赖许可证不因本项目采用 Apache-2.0 而改变。
          required: true
        - label: 我确认没有提交真实凭证、账号信息或未脱敏截图。
          required: true
