name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

defaults:
  run:
    working-directory: Apps/Mac

jobs:
  test:
    name: Unit Tests with Coverage (Mac)
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get Swift version
        run: swift --version
        working-directory: .

      - name: Install Tuist
        run: brew install --cask tuist
        working-directory: .

      - name: Install Dependencies
        run: tuist install

      - name: Generate Project
        run: tuist generate --no-open

      - name: Run Tests with Coverage
        run: |
          xcodebuild test \
            -scheme SmartQuota \
            -workspace SmartQuota.xcworkspace \
            -destination 'platform=macOS,arch=arm64' \
            -enableCodeCoverage YES \
            -skipMacroValidation \
            -resultBundlePath TestResults.xcresult

      - name: Generate Coverage Report
        run: |
          xcrun xccov view --report --json TestResults.xcresult > coverage_report.json
          python3 << 'EOF'
          import json
          import sys

          with open("coverage_report.json") as f:
              data = json.load(f)

          # Minimal summary for CI logs
          targets = data.get("targets", [])
          for t in targets:
              name = t.get("name", "?")
              cov = t.get("lineCoverage", 0)
              print(f"{name}: {cov * 100:.1f}%")
          EOF

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mac-test-results
          path: Apps/Mac/TestResults.xcresult
          if-no-files-found: ignore
