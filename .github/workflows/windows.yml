name: Windows

on:
  push:
    branches: [main, develop]
    paths:
      - "Apps/Windows/**"
      - ".github/workflows/windows.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "Apps/Windows/**"
  workflow_dispatch:

jobs:
  build:
    name: Build Windows (Tauri)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: Apps/Windows

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend deps
        run: npm install

      - name: Build frontend
        run: npm run build

      - name: Cargo check
        working-directory: Apps/Windows/src-tauri
        run: cargo check

      - name: Tauri build (NSIS Setup.exe)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: Apps/Windows
          tauriScript: npm run tauri
          args: --bundles nsis

      - name: Upload Setup.exe
        uses: actions/upload-artifact@v4
        with:
          name: smartquota-windows-setup
          path: Apps/Windows/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: warn
