name: Build

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

defaults:
  run:
    working-directory: Apps/Mac

jobs:
  build:
    name: Build and Verify (Mac)
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Tuist
        run: brew install --cask tuist
        working-directory: .

      - name: Install Dependencies
        run: tuist install

      - name: Generate Project
        run: tuist generate --no-open

      - name: Build Debug
        run: xcodebuild build -scheme SmartQuota -workspace SmartQuota.xcworkspace -destination 'platform=macOS,arch=arm64'

      - name: Build Release
        run: xcodebuild build -scheme SmartQuota -workspace SmartQuota.xcworkspace -destination 'platform=macOS,arch=arm64' -configuration Release
